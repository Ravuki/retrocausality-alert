name: Retrocausality Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hypermyst-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install requests beautifulsoup4

      - name: Sprawdź źródło HYPERMYST
        run: |
          python - <<'PY'
          import requests

          url = "https://twstalker.com/HYPERMYSTx"

          response = requests.get(
              url,
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print("HTTP status:", response.status_code)
          print("Rozmiar odpowiedzi:", len(response.text))

          response.raise_for_status()

          if "HYPERMYST" not in response.text:
              raise RuntimeError(
                  "Źródło nie zawiera profilu HYPERMYST!"
              )

          print("TEST ŹRÓDŁA: OK")
          PY

      - name: Start bota
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python retro_alert.py

      - name: Zapisz pamięć ostatniego tweeta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_tweet.txt

          if git diff --cached --quiet; then
            echo "Brak zmian w pamięci."
          else
            git commit -m "Update HyperMyst tweet memory"
            git push
          fi
