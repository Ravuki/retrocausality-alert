name: Retrocausality Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hypermyst-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Zainstaluj x-cli
        run: |
          go install github.com/tamnd/x-cli/cmd/x@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Sprawdź x-cli
        run: |
          x version

      - name: Ustaw Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: pip install requests

      - name: Test Syndication HYPERMYST
        run: |
          python - <<'PY'
          import json
          import re
          import requests

          url = "https://syndication.twitter.com/srv/timeline-profile/screen-name/HYPERMYSTx"

          print("Pobieram:", url)

          response = requests.get(
              url,
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print("HTTP status:", response.status_code)
          print("Final URL:", response.url)

          response.raise_for_status()

          match = re.search(
              r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',
              response.text,
              re.DOTALL
          )

          if not match:
              raise RuntimeError("Nie znaleziono __NEXT_DATA__!")

          data = json.loads(match.group(1))

          page_props = data["props"]["pageProps"]
          timeline = page_props["timeline"]
          entries = timeline["entries"]

          print("Znaleziono wpisów:", len(entries))
          print("=" * 50)

          found = 0

          for entry in entries:
              content = entry.get("content", {})

              tweet = content.get("tweet", {})
              tweet_id = tweet.get("id_str") or tweet.get("id")

              text = tweet.get("full_text") or tweet.get("text")

              if tweet_id and text:
                  found += 1
                  print("Tweet ID:", tweet_id)
                  print("Treść:", text)
                  print("URL:", f"https://x.com/HYPERMYSTx/status/{tweet_id}")
                  print("-" * 50)

          if found == 0:
              raise RuntimeError("Syndication odpowiedział, ale nie znaleziono tweetów.")

          print("TEST SYNDICATION: OK")
          print("Znalezionych tweetów:", found)
          PY


      - name: Zapisz pamięć ostatniego tweeta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_tweet.txt

          if git diff --cached --quiet; then
            echo "Brak zmian w pamięci."
          else
            git commit -m "Update HyperMyst tweet memory"
            git push
          fi
